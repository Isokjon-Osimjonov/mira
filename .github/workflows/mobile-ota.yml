name: Mobile OTA Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message'
        required: true
        default: 'OTA Update'

jobs:
  ota-update:
    name: EAS Update (OTA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tsx for TS support
        run: npm install -g tsx

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.miramarket.uz/api/v1
        run: |
          node --import tsx/esm \
            $(which eas) update \
            --branch production \
            --message "Auto update: ${{ github.sha }}" \
            --non-interactive
